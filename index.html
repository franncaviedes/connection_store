<script>

    const PRODUCTS = {
        "17": [
            { name: "iPhone 17 Pro Max", storage: "512GB", battery: 99, colors: ["#464C55"], image: "img/iphone-17-pro.png" },
            { name: "iPhone 17 Pro", storage: "256GB", battery: 100, colors: ["#B8B6B3", "#464C55", "#F3F2EE"], image: "img/iphone-17-pro.png" },

        "16": [

            { name: "iPhone 16 Pro", storage: "256GB", battery: 98, colors: ["#B8B6B3", "#464C55", "#F3F2EE"], image:  "img/iphone-16pro.png" },
            { name: "iPhone 16", storage: "128GB", battery: 100, colors: ["#464C55", "#B8B6B3"], image: "img/iphone-16.png" }
        ],
        "15": [
            { name: "iPhone 15 Pro Max", storage: "256GB", battery: 98, colors: ["#464C55"], image:  "img/iphone-16pro.png"  },
            { name: "iPhone 15 Pro", storage: "256GB", battery: 100, colors: ["#B8B6B3", "#464C55", "#F3F2EE"], image:  "img/iphone-16pro.png" },
            { name: "iPhone 15", storage: "128GB", battery: 100, colors: ["#464C55", "#B8B6B3"], image: "img/iphone-15.png" }
        ],
        "14": [
            { name: "iPhone 14 Pro Max", storage: "256GB", battery: 91, colors: ["#464C55", "#F3F2EE"], image:  "img/iphone-16pro.png"  },

        ],
        "13": [
            { name: "iPhone 13 Pro Max", storage: "256GB", battery: 86, colors: ["#464C55", "#F3F2EE"], image:  "img/iphone-16pro.png"  },
            { name: "iPhone 13 Pro", storage: "128GB", battery: 88, colors: ["#464C55", "#B8B6B3"], image: "img/iphone-16pro.png" },
            { name: "iPhone 13", storage: "128GB", battery: 87, colors: ["#464C55", "#B8B6B3", "#F3F2EE"], image: "img/iphone-15.png" }
        ]
    };

    // Catálogo fijo de Sellados: no se organiza por serie, es una lista única
    const SELLADOS = [
        { name: "iPhone 16", storage: "128GB", battery: 100, colors: ["#464C55", "#B8B6B3"], image: "img/iphone-16.png" },
        { name: "iPhone 16 Pro", storage: "256GB", battery: 100, colors: ["#B8B6B3", "#464C55", "#F3F2EE"], image: PLACEHOLDER_IMG },
        { name: "iPhone 17", storage: "256GB", battery: 100, colors: ["#464C55", "#B8B6B3"], image: "img/iphone-16.png"},
        { name: "iPhone 17 Pro", storage: "256GB", battery: 100, colors: ["#B8B6B3", "#464C55", "#F3F2EE"], image: PLACEHOLDER_IMG },
        { name: "iPhone 17 Pro Max", storage: "256GB", battery: 100, colors: ["#464C55"], image: PLACEHOLDER_IMG }
    ];

    function batteryClass(pct) {
        return pct >= 90 ? "text-success-green" : "text-warning-amber";
    }

    function renderCard(p) {
        const swatches = p.colors.map(c =>
            `<div class="w-4 h-4 rounded-full border border-metallic-silver" style="background-color:${c}"></div>`
        ).join("");

        return `
        <article class="bg-surface-container-lowest border border-metallic-silver p-6 flex flex-col group hover:shadow-lg transition-shadow duration-300">
            <div class="flex justify-between items-start mb-6">
                <div class="flex flex-col gap-2">
                    <span class="bg-surface-container-low px-2 py-1 rounded font-label-mono text-label-mono text-secondary w-fit">${p.storage}</span>
                    <span class="bg-surface-container-low px-2 py-1 rounded font-label-mono text-label-mono ${batteryClass(p.battery)} w-fit">Battery: ${p.battery}%</span>
                </div>
                <button class="text-secondary hover:text-primary transition-colors">
                    <span class="material-symbols-outlined">favorite_border</span>
                </button>
            </div>
            <div class="flex-grow flex items-center justify-center mb-6">
                <img class="h-64 object-contain" alt="${p.name}" src="${p.image}"/>
            </div>
            <div class="mt-auto">
                <h3 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2 min-h-[58px] flex items-start">${p.name}</h3>
                <div class="flex items-center justify-between gap-2 mb-4">
                    <div class="flex items-center gap-2">${swatches}</div>
                    ${p.stock !== undefined ? `<span class="font-label-mono text-label-mono text-secondary">Stock: ${p.stock}</span>` : ""}
                </div>
                <div class="flex justify-end items-center">
                    <button class="bg-primary text-on-primary px-4 py-2 hover:bg-inverse-surface transition-colors font-body-md text-body-md">View</button>
                </div>
            </div>
        </article>`;
    }

    let currentCondition = "usados";
    let currentSeries = "15";

    function renderGrid() {
        const grid = document.getElementById("product-grid");
        const items = currentCondition === "sellados" ? SELLADOS : PRODUCTS[currentSeries];
        grid.innerHTML = items.map(renderCard).join("");
    }

    function setActiveSeriesButton(series) {
        document.querySelectorAll(".series-btn").forEach(btn => {
            const isActive = btn.dataset.series === series;
            btn.classList.toggle("border-2", isActive);
            btn.classList.toggle("border-primary", isActive);
            btn.classList.toggle("bg-surface-container-low", isActive);
            btn.classList.toggle("font-bold", isActive);
            btn.classList.toggle("border", !isActive);
            btn.classList.toggle("border-metallic-silver", !isActive);
            btn.classList.toggle("bg-surface-container-lowest", !isActive);
        });
    }

    function setSeriesFiltersEnabled(enabled) {
        const wrapper = document.getElementById("series-filters");
        wrapper.classList.toggle("opacity-40", !enabled);
        wrapper.classList.toggle("pointer-events-none", !enabled);
    }

    document.getElementById("series-filters").addEventListener("click", (e) => {
        const btn = e.target.closest(".series-btn");
        if (!btn) return;
        currentSeries = btn.dataset.series;
        setActiveSeriesButton(currentSeries);
        renderGrid();
    });

    document.getElementById("condition-filters").addEventListener("click", (e) => {
        const btn = e.target.closest(".condition-btn");
        if (!btn) return;
        currentCondition = btn.dataset.condition;

        document.querySelectorAll(".condition-btn").forEach(b => {
            const isActive = b === btn;
            b.classList.toggle("bg-primary", isActive);
            b.classList.toggle("text-on-primary", isActive);
            b.classList.toggle("font-bold", isActive);
            b.classList.toggle("shadow-sm", isActive);
            b.classList.toggle("text-secondary", !isActive);
        });

        // En Sellados el catálogo es fijo (no se filtra por serie), así que
        // los botones de serie se ven deshabilitados mientras esté activo.
        setSeriesFiltersEnabled(currentCondition === "usados");
        renderGrid();
    });

    // Estado inicial: Usados / iPhone 15 (como venía el diseño)
    renderGrid();
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAbT4J-n90ye5n9S-j6TpAmNTv1gslq_fk",
        authDomain: "connectionstore-dccdd.firebaseapp.com",
        projectId: "connectionstore-dccdd",
        storageBucket: "connectionstore-dccdd.firebasestorage.app",
        messagingSenderId: "1040792377063",
        appId: "1:1040792377063:web:839768dd11239ec2f63442",
        measurementId: "G-WH4W0WH89"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);

    async function loadIphone13FromFirebase() {
        try {
            const productRef = doc(db, "productos", "iphone-13");
            const productSnap = await getDoc(productRef);

            if (!productSnap.exists()) {
                console.warn("Firebase: no existe productos/iphone-13.");
                return;
            }

            const data = productSnap.data();
            const iphone13 = PRODUCTS["13"]?.find(p => p.name === "iPhone 13");

            if (!iphone13) {
                console.warn("Firebase: no se encontró el producto iPhone 13 en el catálogo.");
                return;
            }

            // Solo reemplazamos los datos que vienen de Firebase.
            if (data.modelo !== undefined) {
                iphone13.name = String(data.modelo);
            }

            if (data.Stock !== undefined) {
                iphone13.stock = Number(data.Stock);
            }

            // Redibuja el catálogo conservando exactamente el diseño existente.
            renderGrid();

            console.log("Firebase conectado correctamente:", data);
        } catch (error) {
            console.error("Error conectando con Firebase:", error);
        }
    }

    loadIphone13FromFirebase();
</script>
